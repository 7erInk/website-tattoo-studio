          </footer>
          <script src="chatbot.js?v=13" defer></script>
          <script src="cookie-banner.js" defer></script>
          </body>
          </html>'''

          # ── FTP: news.html laden, prüfen, aktualisieren ───────────────────────
          ftp = ftplib.FTP()
          ftp.connect(FTP_HOST, 21, timeout=30)
          ftp.login(FTP_USER, FTP_PASS)

          ftp.cwd(FTP_PATHS[0])
          buf = io.BytesIO()
          ftp.retrbinary('RETR news.html', buf.write)
          news_html = buf.getvalue().decode('utf-8')

          # Duplikat-Schutz: Slug heute schon vorhanden?
          if slug in news_html:
              print(f'⏭ Artikel für heute bereits vorhanden ({slug}), überspringe.')
              ftp.quit()
              sys.exit(0)

          # Duplikat-Schutz: Keyword-Overlap mit bestehenden Artikeln
          existing_slugs = set(re.findall(r'href="([a-z0-9-]+-\d{4}-\d{2}-\d{2})\.html"', news_html))
          existing_slug_bases = set(re.sub(r'-\d{4}-\d{2}-\d{2}$', '', s) for s in existing_slugs)

          if slug_base_raw in existing_slug_bases:
              print(f'⏭ Gleicher Slug-Base bereits vorhanden ({slug_base_raw}), überspringe.')
              ftp.quit()
              sys.exit(0)

          new_keywords = set(w for w in re.split(r'[-_]', slug_base_raw) if len(w) > 4)
          for existing_base in existing_slug_bases:
              existing_keywords = set(w for w in re.split(r'[-_]', existing_base) if len(w) > 4)
              overlap = new_keywords & existing_keywords
              if len(overlap) >= 2:
                  print(f'⏭ Zu ähnlich zu "{existing_base}" (gemeinsam: {overlap}), Claude soll anderes Thema wählen.')
                  # Versuche erneut mit Hinweis auf bereits verwendete Themen
                  # (Für jetzt: überspringen)
                  ftp.quit()
                  sys.exit(0)

          # ── News-Seite aktualisieren ──────────────────────────────────────────
          new_featured = f'''<section class="journal-featured" data-article-category="{cat}">
                <div class="featured-label">Featured · Neuester Bericht</div>
                <a href="{slug}" class="featured-card">
                  <div class="featured-cover cover-{cat}">
                    <div class="featured-cover-badge">{badge}</div>
                    <div class="featured-cover-new">NEU</div>
                    <div class="featured-cover-date">{today_str}</div>
                    <div style="font-size:7rem;position:absolute;bottom:-1rem;right:1rem;opacity:.12;line-height:1">{emoji}</div>
                  </div>
                  <div class="featured-body">
                    <div class="featured-cat">{cat_label} · {today_str}</div>
                    <h2>{esc_title}</h2>
                    <p>{html.escape(lead[:120])}...</p>
                    <div class="featured-meta">
                      <span class="featured-read-time">⏱ 6 Min. Lesezeit</span>
                      <span class="featured-link">Vollständigen Artikel lesen →</span>
                    </div>
                  </div>
                </a>
              </section>'''

          news_html = re.sub(r'<section class="journal-featured".*?</section>', new_featured, news_html, flags=re.DOTALL)

          new_card = f'''<a href="{slug}" class="article-card" data-category="{cat}">
                  <div class="article-cover cover-{cat}">
                    <div class="article-cover-icon">{emoji}</div>
                    <div class="article-cover-badge">{badge}</div>
                  </div>
                  <div class="article-body">
                    <div class="article-cat cat-{cat}">{cat_label}</div>
                    <h3>{esc_title}</h3>
                    <p class="article-excerpt">{html.escape(lead[:100])}...</p>
                    <div class="article-footer">
                      <span class="article-date">{today_str}</span>
                      <span class="article-arrow">&#x2192;</span>
                    </div>
                  </div>
                </a>'''

          grid_tag = '<div class="journal-grid" id="articleGrid">'
          news_html = news_html.replace(grid_tag, grid_tag + '\n      ' + new_card, 1)

          # ── Deploy auf alle FTP-Pfade ─────────────────────────────────────────
          for path in FTP_PATHS:
              ftp.cwd(path)
              ftp.storbinary(f'STOR {slug}', io.BytesIO(article_html.encode('utf-8')))
              ftp.storbinary('STOR news.html', io.BytesIO(news_html.encode('utf-8')))
              print(f'✅ Deployed: {path}/{slug}')

          ftp.quit()
          print(f'🎉 Fertig: {title}')
          PYEOF
