name: Weekly Journal Article

on:
  schedule:
    - cron: '0 6 * * 1'  # Montags 8:00 Uhr Berlin (UTC+2)
  workflow_dispatch:      # Manuell auslösbar

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Generate & Deploy Article
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import ftplib, io, re, json, sys, urllib.request, urllib.error, textwrap, xml.etree.ElementTree as ET
          from datetime import date
          import os, random, html

          FTP_HOST = '82.198.229.223'
          FTP_USER = 'u688179148'
          FTP_PASS = os.environ['FTP_PASSWORD']
          ANTHROPIC_KEY = os.environ.get('ANTHROPIC_API_KEY', '')
          FTP_PATHS = [
              '/domains/7erink.com/public_html/academy',
              '/domains/academy.7erink.com/public_html',
              '/public_html/academy'
          ]

          today = date.today()
          months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
          today_str = f'{today.day}. {months[today.month-1]} {today.year}'

          # ── Echte News via Google News RSS holen ──────────────────────────────
          RSS_FEEDS = [
              'https://news.google.com/rss/search?q=tattoo+news&hl=de&gl=DE&ceid=DE:de',
              'https://news.google.com/rss/search?q=tattoo+trend+2026&hl=de&gl=DE&ceid=DE:de',
              'https://news.google.com/rss/search?q=t%C3%A4towierung+gesetze+EU&hl=de&gl=DE&ceid=DE:de',
              'https://news.google.com/rss/search?q=tattoo+convention+2026&hl=de&gl=DE&ceid=DE:de',
              'https://news.google.com/rss/search?q=tattoo+artist+news&hl=en&gl=US&ceid=US:en',
              'https://news.google.com/rss/search?q=tattoo+ink+health+2026&hl=en&gl=US&ceid=US:en',
          ]

          def fetch_rss_items(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  resp = urllib.request.urlopen(req, timeout=10)
                  root = ET.fromstring(resp.read())
                  items = []
                  for item in root.iter('item'):
                      title = item.find('title')
                      desc = item.find('description')
                      pub = item.find('pubDate')
                      items.append({
                          'title': html.unescape(title.text or '') if title is not None else '',
                          'desc': html.unescape(re.sub(r'<[^>]+>', '', desc.text or '')) if desc is not None else '',
                          'date': pub.text or '' if pub is not None else '',
                      })
                  return items[:5]
              except Exception as e:
                  print(f'⚠️ RSS Fehler {url}: {e}')
                  return []

          all_items = []
          for feed_url in RSS_FEEDS:
              all_items.extend(fetch_rss_items(feed_url))

          # Duplikate entfernen (nach Titel)
          seen = set()
          unique_items = []
          for item in all_items:
              key = item['title'][:60].lower()
              if key and key not in seen:
                  seen.add(key)
                  unique_items.append(item)

          print(f'📰 {len(unique_items)} echte News-Artikel gefunden')

          # ── Fallback-Themen wenn RSS leer ──────────────────────────────────────
          FALLBACK_THEMEN = [
              {'title': 'REACH-Update 2026: Welche Tattoofarben sind jetzt verboten?', 'focus': 'Neue EU-REACH-Verordnung, verbotene Pigmente, was für Studios gilt', 'cat': 'news', 'cat_label': 'Gesetze', 'badge': '⚖️ Gesetze', 'emoji': '⚖️', 'slug_base': 'reach-farbverbot-update-2026'},
              {'title': 'Tattoo-Trends 2026: Was Kunden jetzt wirklich buchen', 'focus': 'Aktuelle Nachfrage nach Stilen, was boomt, was abnimmt, welche Motive dominieren', 'cat': 'trends', 'cat_label': 'Trends', 'badge': '📈 Trends', 'emoji': '📈', 'slug_base': 'tattoo-trends-kunden-2026'},
              {'title': 'Hygiene-Dokumentation im Studio: Die neuen Pflichten', 'focus': 'Aktuelle Vorschriften, worauf Gesundheitsämter achten, Checkliste für Studios', 'cat': 'news', 'cat_label': 'Gesetze', 'badge': '⚖️ Gesetze', 'emoji': '⚖️', 'slug_base': 'hygiene-pflichten-studio-2026'},
              {'title': 'Convention-Saison 2026: Die besten Termine in Europa', 'focus': 'Tattoo Conventions Deutschland, Österreich, Schweiz 2026, Tipps für Artists', 'cat': 'convention', 'cat_label': 'Convention', 'badge': '🏆 Convention', 'emoji': '🏆', 'slug_base': 'tattoo-conventions-europa-2026'},
              {'title': 'Fine Line vs. Blackwork: Was dominiert dieses Jahr?', 'focus': 'Stilvergleich, Nachfrage-Analyse, Vor- und Nachteile für Tätowierer', 'cat': 'trends', 'cat_label': 'Trends', 'badge': '🎨 Trends', 'emoji': '🎨', 'slug_base': 'fine-line-vs-blackwork-2026'},
              {'title': 'Preiskalkulation im Tattoo-Studio: So rechnest du richtig', 'focus': 'Stundensatz, Materialkosten, Mindestpreis, was andere Studios verlangen', 'cat': 'business', 'cat_label': 'Business', 'badge': '💼 Business', 'emoji': '💼', 'slug_base': 'preiskalkulation-tattoo-studio'},
              {'title': 'Tattoo-Maschinen 2026: Coil, Rotary oder Pen?', 'focus': 'Aktuelle Maschinentypen im Vergleich, was Profi-Artists empfehlen', 'cat': 'technik', 'cat_label': 'Technik', 'badge': '⚙️ Technik', 'emoji': '⚙️', 'slug_base': 'tattoo-maschinen-vergleich-2026'},
              {'title': 'Kundenkommunikation: Wie du schwierige Anfragen professionell handhabst', 'focus': 'Umgang mit unrealistischen Wünschen, Preisverhandlung, No-Shows verhindern', 'cat': 'business', 'cat_label': 'Business', 'badge': '💼 Business', 'emoji': '💼', 'slug_base': 'kundenkommunikation-tattoo-profi'},
              {'title': 'Realistisches Tattoo stechen: Worauf es wirklich ankommt', 'focus': 'Technik, Schattierung, Referenzfotos nutzen, häufige Anfängerfehler', 'cat': 'technik', 'cat_label': 'Technik', 'badge': '⚙️ Technik', 'emoji': '⚙️', 'slug_base': 'realismus-tattoo-technik-tipps'},
              {'title': 'Social Media für Tätowierer: Was 2026 wirklich funktioniert', 'focus': 'Instagram vs TikTok, Content-Strategie, Algorithmus-Tipps für Artists', 'cat': 'business', 'cat_label': 'Business', 'badge': '💼 Business', 'emoji': '💼', 'slug_base': 'social-media-taetowierer-2026'},
              {'title': 'Tattoo-Pflege: Was du deinen Kunden empfehlen solltest', 'focus': 'Aktuelle Heilungsempfehlungen, Produkte, was Dermatologen sagen', 'cat': 'technik', 'cat_label': 'Technik', 'badge': '⚙️ Technik', 'emoji': '⚙️', 'slug_base': 'tattoo-pflege-empfehlungen-2026'},
              {'title': 'Schwarz & Grau Realismus: Warum dieser Stil so gefragt ist', 'focus': 'Geschichte des Stils, technische Anforderungen, Warum Kunden ihn lieben', 'cat': 'trends', 'cat_label': 'Trends', 'badge': '🎨 Trends', 'emoji': '🎨', 'slug_base': 'black-grey-realismus-gefragt'},
              {'title': 'Steuerliche Grundlagen für selbstständige Tätowierer', 'focus': 'Umsatzsteuer, Betriebsausgaben, Kassenbuch, was Finanzamt prüft', 'cat': 'business', 'cat_label': 'Business', 'badge': '💼 Business', 'emoji': '💼', 'slug_base': 'steuer-grundlagen-taetowierer'},
              {'title': 'Tattoo-Farben: Welche Pigmente halten am längsten?', 'focus': 'Farbqualität, Verblassen, Unterschiede zwischen Marken, was Profis nutzen', 'cat': 'technik', 'cat_label': 'Technik', 'badge': '⚙️ Technik', 'emoji': '⚙️', 'slug_base': 'tattoo-farben-pigmente-qualitaet'},
          ]

          # ── Claude API aufrufen ────────────────────────────────────────────────
          def generate_from_real_news(news_items, api_key):
              if not api_key:
                  return None, None

              # Top 5 News als Kontext für Claude
              news_context = '\n'.join([
                  f'- {item["title"]}: {item["desc"][:200]}'
                  for item in news_items[:5]
              ])

              prompt = textwrap.dedent(f"""\
                  Du bist Tom Irschina, erfahrener Tätowierer (16+ Jahre, 50+ Convention Awards, Black & Grey Spezialist, 7er Ink Academy München).

                  Hier sind aktuelle Neuigkeiten aus der Tattoo-Welt von heute:

                  {news_context}

                  Wähle das relevanteste und interessanteste Thema aus diesen echten News aus.
                  Schreibe dann einen professionellen Artikel für die Academy-Website — aus Toms Perspektive, auf Deutsch.
                  Beziehe dich auf die echten Ereignisse. Ergänze mit Praxiswissen und Einschätzungen.

                  Antworte NUR mit gültigem JSON:
                  {{
                    "title": "Artikel-Überschrift (prägnant, 6-10 Wörter, bezieht sich auf echte News)",
                    "cat": "news|trends|technik|business|convention",
                    "cat_label": "Gesetze|Trends|Technik|Business|Convention|Welt-News",
                    "badge": "⚖️ Gesetze|📈 Trends|⚙️ Technik|💼 Business|🏆 Convention|🌍 Welt-News",
                    "emoji": "⚖️|📈|⚙️|💼|🏆|🌍|🎨|🔬|🛒",
                    "slug_base": "kurzer-slug-ohne-datum",
                    "lead": "Einleitung (2-3 Sätze, packend, auf echte News bezogen)",
                    "s1_h2": "Überschrift Abschnitt 1",
                    "s1_text": "Text Abschnitt 1 (3-5 Sätze, konkreter Bezug auf aktuelle Ereignisse)",
                    "s2_h2": "Überschrift Abschnitt 2",
                    "s2_text": "Text Abschnitt 2 (3-5 Sätze, Praxisrelevanz für Tätowierer)",
                    "s3_h2": "Überschrift Abschnitt 3",
                    "s3_text": "Text Abschnitt 3 (3-5 Sätze, Ausblick oder Handlungsempfehlung)",
                    "tipp": "Toms praktischer Tipp (1-2 Sätze, konkret)"
                  }}""")

              try:
                  req = urllib.request.Request(
                      'https://api.anthropic.com/v1/messages',
                      data=json.dumps({
                          'model': 'claude-haiku-4-5-20251001',
                          'max_tokens': 1500,
                          'messages': [{'role': 'user', 'content': prompt}]
                      }).encode(),
                      headers={
                          'Content-Type': 'application/json',
                          'x-api-key': api_key,
                          'anthropic-version': '2023-06-01'
                      }
                  )
                  response = urllib.request.urlopen(req, timeout=30)
                  data = json.loads(response.read())
                  text = data['content'][0]['text'].strip()
                  json_match = re.search(r'\{[\s\S]*\}', text)
                  if json_match:
                      result = json.loads(json_match.group())
                      return result, news_items[:3]
              except Exception as e:
                  print(f'⚠️ API-Fehler: {e}')
              return None, None

          def generate_from_fallback(thema, api_key):
              if not api_key:
                  return None
              prompt = textwrap.dedent(f"""\
                  Du bist Tom Irschina, erfahrener Tätowierer (16+ Jahre, 50+ Convention Awards, Black & Grey Spezialist).
                  Thema: {thema['title']}
                  Fokus: {thema['focus']}
                  Schreibe einen praxisnahen Artikel auf Deutsch. Nur JSON:
                  {{"lead":"...","s1_h2":"...","s1_text":"...","s2_h2":"...","s2_text":"...","s3_h2":"...","s3_text":"...","tipp":"..."}}""")
              try:
                  req = urllib.request.Request(
                      'https://api.anthropic.com/v1/messages',
                      data=json.dumps({
                          'model': 'claude-haiku-4-5-20251001',
                          'max_tokens': 1200,
                          'messages': [{'role': 'user', 'content': prompt}]
                      }).encode(),
                      headers={
                          'Content-Type': 'application/json',
                          'x-api-key': api_key,
                          'anthropic-version': '2023-06-01'
                      }
                  )
                  response = urllib.request.urlopen(req, timeout=30)
                  data = json.loads(response.read())
                  text = data['content'][0]['text'].strip()
                  json_match = re.search(r'\{[\s\S]*\}', text)
                  if json_match:
                      return json.loads(json_match.group())
              except Exception as e:
                  print(f'⚠️ Fallback API-Fehler: {e}')
              return None

          # ── Artikel generieren ─────────────────────────────────────────────────
          thema_data = None
          source_news = None

          if unique_items:
              print(f'✅ Generiere Artikel aus echten News...')
              result, source_news = generate_from_real_news(unique_items, ANTHROPIC_KEY)
              if result:
                  thema_data = result
                  print(f'✅ Artikel basierend auf echten News: {result.get("title", "")}')

          if not thema_data:
              # Fallback: rotierendes Thema
              fallback = FALLBACK_THEMEN[today.toordinal() % len(FALLBACK_THEMEN)]
              print(f'⚠️ Kein RSS-Inhalt, nutze Fallback: {fallback["title"]}')
              fb_content = generate_from_fallback(fallback, ANTHROPIC_KEY)
              if fb_content:
                  thema_data = {**fallback, **fb_content}
              else:
                  thema_data = {
                      **fallback,
                      'lead': f'Tom Irschina über: {fallback["title"]}.',
                      's1_h2': 'Aktuelle Entwicklungen', 's1_text': 'Die Branche entwickelt sich weiter.',
                      's2_h2': 'Was das bedeutet', 's2_text': 'Tätowierer müssen informiert bleiben.',
                      's3_h2': 'Fazit', 's3_text': 'Weiterbildung ist entscheidend.',
                      'tipp': 'Bleib informiert und tausch dich aus.'
                  }

          # ── Slug & Metadaten ───────────────────────────────────────────────────
          slug_base_raw = thema_data.get('slug_base', 'tattoo-news')
          slug_base = f'{slug_base_raw}-{today.strftime("%Y-%m-%d")}'
          base = re.sub(r'[^a-z0-9-]', '-', slug_base.lower())
          base = re.sub(r'-+', '-', base).strip('-')
          slug = base + '.html'

          title = thema_data.get('title', 'Tattoo News')
          cat = thema_data.get('cat', 'news')
          cat_label = thema_data.get('cat_label', 'News')
          badge = thema_data.get('badge', '📰 News')
          emoji = thema_data.get('emoji', '📰')
          lead = thema_data.get('lead', '')
          sections = [
