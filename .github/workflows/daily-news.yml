          # ── FTP Deploy ─────────────────────────────────────────────────────────
          ftp = ftplib.FTP()
          ftp.connect(FTP_HOST, 21, timeout=30)
          ftp.login(FTP_USER, FTP_PASS)

          ftp.cwd(FTP_PATHS[0])
          buf = io.BytesIO()
          ftp.retrbinary('RETR news.html', buf.write)
          news_html = buf.getvalue().decode('utf-8')

          # Kaputte Einträge bereinigen
          broken_before = len(re.findall(r'<a href="[a-z0-9-]+-html" class="article-card"', news_html))
          if broken_before > 0:
              news_html = re.sub(r'<a href="[a-z0-9-]+-html" class="article-card".*?</a>', '', news_html, flags=re.DOTALL)
              print(f'🧹 {broken_before} kaputte Einträge entfernt.')

          # Duplikat-Schutz: gleicher Slug heute
          if slug in news_html:
              print(f'⏭ Artikel für heute bereits vorhanden ({slug}), überspringe.')
              if broken_before > 0:
                  for path in FTP_PATHS:
                      ftp.cwd(path)
                      ftp.storbinary('STOR news.html', io.BytesIO(news_html.encode('utf-8')))
              ftp.quit()
              sys.exit(0)

          # Duplikat-Schutz: gleiches Thema oder ähnlicher Slug bereits vorhanden
          existing_slugs = set(re.findall(r'href="([a-z0-9-]+-\d{4}-\d{2}-\d{2})\.html"', news_html))
          existing_slug_bases = set(re.sub(r'-\d{4}-\d{2}-\d{2}$', '', s) for s in existing_slugs)

          # Prüfe exakten slug_base
          if slug_base_raw in existing_slug_bases:
              print(f'⏭ Thema bereits veröffentlicht ({slug_base_raw}), überspringe.')
              ftp.quit()
              sys.exit(0)

          # Prüfe ob Schlüsselwörter des neuen Themas zu stark mit vorhandenen übereinstimmen
          new_keywords = set(w for w in re.split(r'[-_]', slug_base_raw) if len(w) > 4)
          for existing_base in existing_slug_bases:
              existing_keywords = set(w for w in re.split(r'[-_]', existing_base) if len(w) > 4)
              overlap = new_keywords & existing_keywords
              if len(overlap) >= 2:  # 2+ gemeinsame Schlüsselwörter = Duplikat
                  print(f'⏭ Zu ähnlich zu bestehendem Artikel ({existing_base}, gemeinsam: {overlap}), überspringe.')
                  ftp.quit()
                  sys.exit(0)

