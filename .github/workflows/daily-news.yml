                  'sections': [
                      ('Fitzpatrick-Skala: Was sie für Tätowierer bedeutet', 'Die Fitzpatrick-Skala teilt Hauttypen 1–6 ein – von sehr hell bis sehr dunkel. Für Tätowierer ist das praktisch relevant: Auf hellerer Haut (Typ 1–2) sind feine Details gut sichtbar, aber rote und orange Farben können Hautreizungen auslösen.\n\nAuf dunkler Haut (Typ 4–6) verschwinden viele Farben – Gelb, Hellgrün, Pink sind kaum sichtbar. Black & Grey und dunkle Farben funktionieren am besten. Die Kunst: Design und Farbwahl an den Hauttyp anpassen.'),
                      ('Gealterte Haut: andere Regeln', 'Mit dem Alter verliert die Haut Elastizität und wird dünner. Das beeinflusst das Tattoo: Linien können schwerer gesetzt werden, Farben heilen anders, Details verlaufen leichter.\n\nFür Artists: Ältere Kunden brauchen mehr Zeit, sanfteres Einstechen und realistischere Erwartungen für filigrane Designs. Einfache, klare Motive mit starken Kontrasten halten besser.'),
