                  'cat': 'trends', 'cat_label': 'Stile',
                  'badge': '🎨 Stile', 'emoji': '🎨',
                  'lead': 'Black & Grey, Fine Line, Neo-Traditional, Realismus – die Tattoo-Welt hat viele Gesichter. Tom Irschina erklärt die wichtigsten Stile und was sie auszeichnet.',
                  'sections': [
                      ('Black & Grey Realismus: der zeitlose Klassiker', 'Black & Grey ist der Stil bei dem Tom Irschina zu Hause ist – und einer der anspruchsvollsten überhaupt. Hier zählt nicht die Farbe, sondern die Beherrschung von Licht und Schatten. Porträts, Tiere, Landschaften – alles was dreidimensionale Tiefe braucht.\n\nDer Vorteil: Black & Grey altert besser als Farbtattoos. Keine ausgeblichenen Pigmente nach Jahren in der Sonne. Ein gut gestochenes Black & Grey Tattoo sieht auch mit 50 noch stark aus.'),
                      ('Fine Line: der Boom-Stil der letzten Jahre', 'Fine Line explodiert seit 2022 – dünne, präzise Linien, oft ohne Shading, minimalistisch oder hochdetailliert. Der Reiz: zart und elegant, besonders beliebt bei Frauen. Der Nachteil: Fine Line verzeiht keine Fehler. Jede Linie muss sitzen.\n\nAußerdem heilt Fine Line kritischer als andere Stile. Zu tief gestochen verlaufen die Linien. Die Technik erfordert echte Präzision – und einen Artist der sie beherrscht.'),
                      ('Neo-Traditional und Watercolor: Farbe mit Aussage', 'Neo-Traditional verbindet klassische Tattoo-Formen mit moderner Farbgebung und Detailreichtum. Kräftige Outlines, lebendige Farben, oft mit floralen oder tierischen Motiven.\n\nWatercolor-Tattoos simulieren Aquarellmalerei auf der Haut – ohne harte Konturen, mit fließenden Farbübergängen. Spektakulär frisch – aber schwieriger zu erhalten. Ohne solide Outlines verblasst Watercolor schneller.'),
