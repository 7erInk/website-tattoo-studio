                  'sections': [
                      ('Warum Conventions so wichtig sind', 'Auf einer Convention triffst du in zwei Tagen mehr relevante Menschen als in einem Jahr über Social Media. Artists, Kollegen, potenzielle Kunden, Ausrüster – alles auf einem Fleck. Für Einsteiger ist das unersetzlich: Du siehst auf welchem Niveau internationale Artists arbeiten.\n\nFür erfahrene Artists sind Conventions die Möglichkeit Awards zu gewinnen – und die zählen. Ein Convention-Award ist das beste Portfolio-Stück das du haben kannst.'),
                      ('Die wichtigsten Conventions in Deutschland 2026', 'International Tattoo Convention Köln: Eine der ältesten und renommiertesten in Deutschland. Dortmund TattooCON: Große Halle, viele internationale Artists. Hamburg Tattoo Convention: Starkes Norddeutschland-Event. Berlin Tattoo Convention: Hauptstadt-Flair mit internationaler Besetzung.\n\nSchweiz und Österreich haben ebenfalls starke Events – Zürich und Wien sind einen Besuch wert.'),
                      ('Wie du als Artist einen Booth bekommst', 'Der Weg zum eigenen Convention-Booth: Bewerbung 3–6 Monate vorher, Portfolio einschicken, auf Zusage warten. Die Nachfrage übersteigt das Angebot bei guten Conventions.\n\nFür Einsteiger empfehle ich erst als Besucher mehrere Conventions zu erleben, Kontakte zu knüpfen, und dann gezielt bei einer kleineren lokalen Convention zu bewerben.'),
