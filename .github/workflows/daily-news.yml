                <li class="nav-dropdown"><a>Wissen</a><div class="dropdown-menu"><a href="taetowieren-lernen.html">Tätowieren lernen</a><a href="tattoo-stile.html">Tattoo Stile</a><a href="tattoo-abc.html">Tattoo ABC</a><a href="standorte.html">Städte</a><a href="news.html">Journal &amp; News</a></div></li>
                <li class="nav-dropdown"><a>Ratgeber</a><div class="dropdown-menu"><a href="wie-viel-verdient-ein-taetowierer.html">Tätowierer Verdienst</a><a href="tattoo-maschine-anfaenger.html">Maschinen für Anfänger</a><a href="tattoo-apprenticeship-vs-online.html">Apprenticeship vs. Online</a><a href="tattoo-preise-berechnen.html">Preise berechnen</a><a href="tattoo-business-starten.html">Business starten</a><a href="tattoo-ausbildung-kosten.html">Ausbildung Kosten</a></div></li>
                <li><a href="tom.html">Über Tom</a></li><li><a href="vorher-nachher.html">Vorher &amp; Nachher</a></li>
              </ul>
              <a href="https://calendly.com/timkrampe/beratungsgespraech-mit-tim?month=2026-04" target="_blank" rel="noopener" class="btn btn-gold nav-cta">Beratung anfragen</a>
              <button class="burger" id="burger"><span></span><span></span><span></span></button>
            </div>
          </nav>'''

          sections_html = ''
          for h2, body in sections:
              if h2 and body:
                  sections_html += f'<h2>{h2}</h2>\n<p>{body}</p>\n\n'

          article_html = f'''<!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{title} | 7er Ink Academy</title>
            <meta name="description" content="{lead[:155]}">
            <link rel="canonical" href="https://academy.7erink.com/{slug}">
            <link rel="icon" type="image/png" href="images/favicon.png">
            <link rel="stylesheet" href="academy.css?v=240">
            <script type="application/ld+json">
            {{"@context":"https://schema.org","@type":"NewsArticle","headline":"{title}","datePublished":"{today.isoformat()}","dateModified":"{today.isoformat()}","author":{{"@type":"Person","name":"Tom Irschina"}},"publisher":{{"@type":"Organization","name":"7er Ink Tattoo Academy","url":"https://academy.7erink.com"}},"url":"https://academy.7erink.com/{slug}","articleSection":"{cat_label}"}}
            </script>
            <script src="nav.js" defer></script>
            <style>
