          # FTP verbinden
          ftp = ftplib.FTP()
          ftp.connect(FTP_HOST, 21, timeout=30)
          ftp.login(FTP_USER, FTP_PASS)

          # news.html laden und updaten
          ftp.cwd(FTP_PATHS[0])
          buf = io.BytesIO()
          ftp.retrbinary('RETR news.html', buf.write)
          news_html = buf.getvalue().decode('utf-8')

          # Bereinigung: kaputte Einträge entfernen (href endet mit -html statt .html)
          broken_before = len(re.findall(r'<a href="[a-z0-9-]+-html" class="article-card"', news_html))
          if broken_before > 0:
              news_html = re.sub(
                  r'<a href="[a-z0-9-]+-html" class="article-card".*?</a>',
                  '', news_html, flags=re.DOTALL
              )
              print(f'🧹 {broken_before} kaputte Einträge (-html Suffix) entfernt.')

          # Duplikat-Schutz: Artikel nur einfügen wenn Slug noch nicht vorhanden
          if slug in news_html:
              print(f'⏭ Artikel für heute bereits vorhanden ({slug}), überspringe.')
              if broken_before > 0:
                  for path in FTP_PATHS:
                      ftp.cwd(path)
                      ftp.storbinary('STOR news.html', io.BytesIO(news_html.encode('utf-8')))
                      print(f'✅ news.html bereinigt: {path}')
              ftp.quit()
              sys.exit(0)

