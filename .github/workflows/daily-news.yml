                  'cat': 'technik', 'cat_label': 'Technik',
                  'badge': '🤖 Technik', 'emoji': '🤖',
                  'lead': 'Midjourney, Stable Diffusion, Adobe Firefly – KI-generierte Designs sind in der Tattoo-Branche angekommen. Tom Irschina erklärt ehrlich: Was kann KI, was kann sie nicht, und wie soll ein Artist damit umgehen?',
                  'sections': [
                      ('Was KI-Tools heute können', 'KI-Tools wie Midjourney erzeugen in Sekunden Tattoo-Designs die visuell beeindruckend sind. Für Inspiration, Moodboards und Varianten sind sie nützlich. Kunden zeigen Artists zunehmend KI-generierte Bilder als Referenz.\n\nDas Problem: KI-Designs ignorieren die Realität der Haut. Sie enthalten feine Details die in der Praxis unleserlich werden, Farbverläufe die sich nicht umsetzen lassen, und Kompositionen die auf einem echten Körper nicht funktionieren.'),
                      ('Das Copyright-Problem', '2026 ist die Rechtslage noch immer unklar: Wer besitzt das Copyright auf ein KI-generiertes Design? In den meisten Rechtssystemen gilt: niemand – KI-Output ist gemeinfrei. Das bedeutet: Ein Konkurrent kann dasselbe Design bei KI anfragen und es ebenfalls nutzen.\n\nEin weiteres Problem: KI ist auf den Arbeiten echter Artists trainiert – oft ohne deren Wissen oder Erlaubnis. Viele Artists sehen das als Diebstahl ihrer Arbeit.'),
                      ('Wie du als Artist damit umgehst', 'KI als Inspiration nutzen, nicht als Abkürzung – das ist meine Empfehlung. Wenn ein Kunde ein KI-Bild bringt: nutze es als Ausgangspunkt, aber entwickle daraus ein eigenes, umsetzbares Design. Das ist dein Mehrwert.\n\nDein Handwerk, dein Stilgefühl, dein Verständnis für Hautverhalten und Körperform – das kann keine KI ersetzen. Wer sich jetzt auf KI-Copy verlässt, baut keine echte Karriere.'),
