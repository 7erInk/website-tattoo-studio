                  'badge': '💧 Pflege', 'emoji': '💧',
                  'lead': 'Ein frisches Tattoo ist eine offene Wunde. Was du in den ersten Wochen tust – oder nicht tust – entscheidet wie dein Tattoo in zehn Jahren aussieht.',
                  'sections': [
                      ('Die ersten 48 Stunden: das Wichtigste', 'Nach der Sitzung klebt dein Artist eine Folie oder einen Verband auf das frische Tattoo. Diese Abdeckung bleibt je nach Material 2–24 Stunden. Danach: vorsichtig mit lauwarmem Wasser und milder Seife abwaschen, sanft abtupfen – nie reiben.\n\nIn den ersten Tagen sondert das Tattoo Lymphflüssigkeit und überschüssige Farbe ab. Das ist normal. Dein Körper reagiert auf die Verletzung. Halte die Stelle sauber und feucht – aber nicht nass.'),
                      ('Was du unbedingt vermeiden musst', 'Sonne ist der größte Feind eines frischen Tattoos. UV-Strahlen zersetzen die Farbpigmente – ein frisches Tattoo darf die ersten 4 Wochen nicht in direkte Sonne.\n\nKein Schwimmbad, keine Sauna, kein Baden in den ersten 2–3 Wochen. Chlorwasser und stehende Gewässer sind Infektionsrisiken. Nicht kratzen, nicht scheuern. Wenn es juckt – sanft draufklopfen.'),
                      ('Welche Pflegeprodukte sind gut?', 'Die Branche schwört auf verschiedene Produkte – Bepanthen ist der Klassiker, Hustle Butter der Profi-Favorit. Wichtig ist: keine parfümierten Lotionen, keine Produkte mit Alkohol. Dünn auftragen, mehrmals täglich.\n\nEin gut gepflegtes Tattoo heilt in 2–4 Wochen oberflächlich. Die tiefen Hautschichten brauchen bis zu 6 Monate.'),
