                  'slug': f'tattoo-gesetze-aenderungen-2026-{today.strftime("%Y-%m-%d")}',
                  'title': 'Neue Tattoo-Gesetze 2026: Was sich in Deutschland und der EU geändert hat',
                  'cat': 'news', 'cat_label': 'Gesetze',
                  'badge': '⚖️ Gesetze', 'emoji': '⚖️',
                  'lead': 'Die rechtlichen Anforderungen ans Tätowieren werden strenger. Tom Irschina erklärt welche neuen Regeln 2026 gelten – und was du als Artist jetzt wissen musst.',
                  'sections': [
                      ('REACH-Update: Neue Farbverbote in Kraft', 'Die EU-REACH-Verordnung wird kontinuierlich erweitert. 2026 kamen weitere Pigmente auf die Verbotsliste – darunter bestimmte Azo-Farbstoffe die bisher in roten und orangefarbenen Tattoofarben eingesetzt wurden. Betroffen sind Artists die auf kräftige Farbgebung spezialisiert sind.\n\nDie gute Nachricht: Hersteller wie Intenze, World Famous Ink und Eternal haben REACH-konforme Alternativen entwickelt. Wer aktuell zertifizierte Farben kauft ist auf der sicheren Seite. Das Problem liegt bei älteren Beständen in Schubladen.'),
                      ('Neue Hygiene-Dokumentationspflicht ab 2026', 'In mehreren deutschen Bundesländern wurden die Dokumentationspflichten für Tätowierstudios verschärft. Konkret: Jeder Tattoo-Vorgang muss mit Datum, verwendeten Materialien (inkl. Chargennummer der Farben und Nadeln) und Kundenangaben dokumentiert werden.\n\nDas klingt bürokratisch – ist aber sinnvoll. Im Fall einer Reklamation oder Infektion hast du damit einen lückenlosen Nachweis. Studios die das nicht umsetzen riskieren bei Gesundheitsamtskontrollen empfindliche Bußgelder.'),
                      ('Mindestalter und Einwilligungspflicht: Was gilt?', 'Bundesweit gilt: Kein Tattoo unter 18 Jahren – auch nicht mit Einwilligung der Eltern. Einige Studios arbeiten trotzdem mit 16-Jährigen (mit elterlicher Genehmigung) – das ist rechtlich ein Graubereich der von Bundesland zu Bundesland unterschiedlich bewertet wird.\n\nKlar ist: Wer Minderjährige tätowiert geht ein erhebliches Risiko ein. Die Einwilligung muss immer schriftlich vorliegen, das Datum muss überprüft werden. Im Zweifelsfall: Ausweis verlangen.'),
