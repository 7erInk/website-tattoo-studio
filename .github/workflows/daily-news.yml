            </div>
            <div class="article-author">
              <div class="article-author-avatar">T</div>
              <div>
                <div class="article-author-name">Tom Irschina</div>
                <div class="article-author-role">Tattoo Artist &amp; Gründer 7er Ink Academy · 16+ Jahre · 50+ Convention Awards · Black &amp; Grey Spezialist</div>
              </div>
