                  'cat': 'news', 'cat_label': 'Welt-News',
                  'badge': '🌍 Welt-News', 'emoji': '🌍',
                  'lead': 'Die Tattoo-Branche ist global vernetzt. Tom Irschina berichtet was sich 2026 weltweit in der Szene tut – von Regulierungen über neue Märkte bis zu kulturellen Entwicklungen.',
                  'sections': [
                      ('Japan öffnet sich: Tattoos und der gesellschaftliche Wandel', 'Japan war jahrzehntelang das problematischste Land für Tätowierer – Tattoos galten als Yakuza-Symbol, Artists wurden verhaftet. 2020 entschied der Oberste Gerichtshof: Tätowieren ist Kunst, keine Medizin, kein Verbot. 2026 erleben japanische Tattoo-Studios einen regelrechten Boom.\n\nJapanische Artists bringen dabei ihre eigene Tradition mit – Tebori (Handstechen), Irezumi (traditionelles Japanese Style) gewinnen international massiv an Interesse. Wer Japanese Style anbieten will sollte die Wurzeln kennen.'),
                      ('USA: Regulierungswelle trifft Tattoo-Branche', 'In den USA wächst die staatliche Regulierung. Mehrere Bundesstaaten haben 2025/26 neue Hygienestandards eingeführt – Pflicht-Zertifizierungen, regelmäßige Inspektionen, digitale Kundendokumentation. Was in Europa schon länger Standard ist, holt die USA gerade nach.\n\nDas hat Folgewirkungen: Günstig-Studios ohne Professionalisierung werden verdrängt. Kunden achten mehr auf Zertifikate und hygienische Standards. Für qualifizierte Artists ist das eine Chance.'),
                      ('Social Media reguliert Tattoo-Content', 'Instagram und TikTok haben ihre Richtlinien für Tattoo-Content verschärft – bestimmte Körperstellen werden automatisch verborgen oder Accounts eingeschränkt. Das trifft Artists die auf Social Media ihren Lebensunterhalt aufbauen.\n\nDie Reaktion der Szene: eigene Plattformen, Newsletter, direkte Kundenbeziehungen. Wer 2026 als Tattoo-Artist nur auf Instagram setzt, baut auf Sand. Eine eigene Website und E-Mail-Liste sind wichtiger denn je.'),
                  ],
                  'tipp': 'Verfolge internationale Tattoo-News regelmäßig – nicht nur für den Weitblick, sondern weil sich Trends aus Japan, USA und Brasilien oft 2–3 Jahre später auch in Deutschland durchsetzen.',
                  'cta_text': 'Willst du in einer Branche arbeiten die globale Entwicklungen versteht?',
