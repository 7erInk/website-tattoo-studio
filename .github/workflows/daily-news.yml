                      ('Ignorant Style: Absicht als Konzept', 'Ignorant Style sieht aus als hätte ein Kind mit Kugelschreiber gezeichnet – aber das ist genau der Punkt. Grobe Linien, einfache Motive, keine Shading-Finesse. Der Witz: Es ist verdammt schwer, wirklich gut "schlecht" zu sein.\n\nDer Stil kommt aus dem Street-Art-Umfeld und ist gerade bei jüngeren Kunden extrem gefragt. Für Artists: Wer Ignorant Style macht muss trotzdem sauber stechen – die Linien müssen bewusst grob sein, nicht unbeabsichtigt wackelig.'),
                      ('Sketch Style und Illustrative Tattoos', 'Sketch-Style simuliert eine Bleistiftzeichnung auf der Haut – mit bewusst unvollständigen Linien, Schraffuren und Skizzen-Ästhetik. Eng verwandt ist der Illustrative Style: Comic-Panels, Buchillustration, Kinderbuch-Ästhetik auf der Haut.\n\nBeide Stile erleben 2026 einen Boom – Instagram-tauglich, gut fotografierbar, und weit weg vom Standard-Tattoo. Für Artists die narratives Storytelling auf der Haut mögen ist das ein dankbares Terrain.'),
                      ('Grunge und Distressed Aesthetics', 'Gegenentwurf zum makellosen Fine Line: Grunge Tattoos arbeiten bewusst mit Unvollkommenheit. Texturierte Flächen, aufgerissene Ränder, verwitterte Optik. Beeinflusst von Punk und DIY-Kultur.\n\nTechnisch anspruchsvoller als es aussieht: Die richtige Dosierung macht den Unterschied zwischen "gewollt roh" und "schlecht gestochen". Wer diesen Stil beherrscht hat eine echte Nische.'),
                  ],
                  'tipp': 'Stile aus Social Media einfach kopieren reicht nicht – versteh die Intention dahinter. Warum funktioniert Ignorant Style? Was macht Sketch Style interessant? Wenn du das verstehst, kannst du eigene Interpretationen entwickeln.',
