                  'lead': 'Die Tattoo-Welt entwickelt sich schnell. Tom Irschina zeigt welche Stile und Motive 2026 dominieren – und was das für Artists und Kunden bedeutet.',
                  'sections': [
                      ('Fine Line bleibt dominant', 'Fine Line ist seit drei Jahren auf dem Vormarsch und zeigt keine Anzeichen des Abschwungs. Botanische Motive, abstrakte Geometrie, zarte Portraits.\n\nFür Artists: Wer Fine Line nicht beherrscht verliert Kunden. Die Technik erfordert Präzision und die richtigen Maschinen.'),
                      ('Blackwork und Dotwork im Aufwind', 'Blackwork – große, mutige Schwarz-Flächen oft mit ornamentalen oder tribalen Einflüssen – erlebt ein Revival. Nicht die alten Tribal-Tattoos der 90er, sondern moderne, durchdachte Designs mit architektonischer Qualität.\n\nDotwork schafft durch Punktraster beeindruckende Texturen und Shading-Effekte ohne klassische Linien.'),
                      ('Personalisierung schlägt alles', 'Der größte Trend 2026 ist kein Stil – es ist die Individualität. Kunden wollen keine Flash-Designs von der Stange. Custom-Designs, persönliche Symbole, Handschriften von Verstorbenen, bedeutsame Orte.\n\nFür Artists: Wer Custom-Designs anbieten kann und Kundenwünsche in starke Tattoos übersetzen kann, ist gefragt wie nie.'),
