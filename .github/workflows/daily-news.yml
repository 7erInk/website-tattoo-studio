              (thema_data.get('s2_h2', ''), thema_data.get('s2_text', '')),
              (thema_data.get('s3_h2', ''), thema_data.get('s3_text', '')),
          ]
          tipp = thema_data.get('tipp', '')

          # ── HTML generieren ────────────────────────────────────────────────────
          nav = '''<nav id="nav" class="solid">
            <div class="nav-inner">
              <a href="index.html" class="nav-logo">7er Ink <span class="accent">Academy</span></a>
              <ul class="nav-links">
