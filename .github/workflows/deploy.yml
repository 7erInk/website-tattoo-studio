name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  # 1) Hauptseite 7erink.com → public_html/
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy 7erink.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .agents/**
            **/node_modules/**
            .DS_Store
            memory/
            CLAUDE.md
            auto-push.sh
            htaccess_upload.txt
            academy/**
            bearson/**
            7er INK Bilder/**
            bilder 7er ink website/**

  # 2) Academy academy.7erink.com → domains/academy.7erink.com/public_html/
  deploy-academy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy academy.7erink.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /domains/academy.7erink.com/public_html/
          local-dir: ./academy/
          exclude: |
            **/.git*
            **/.git*/**
            .DS_Store
            Bilder über mich/**
            Vorher : Nachher/**
            Referenz/**
